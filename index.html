                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white p-6 shadow-sm border rounded-lg">

                                <ResponsiveContainer width="100%" height="100%">
                                    <PieChart>
                                        <Pie data={stats.canalesData} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius={50} outerRadius={80} paddingAngle={5}>

                                        </Pie>
                                        <Tooltip />
                                        <Legend verticalAlign="bottom" height={36} iconType="circle" />
                                    </PieChart>
                                </ResponsiveContainer>

                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={stats.quizHistory}>
                                        <XAxis dataKey="name" tick={{fontSize: 8, fontWeight: 'bold'}} axisLine={false} tickLine={false} />

                                                <linearGradient id="upBlueGrad" x1="0" y1="0" x2="0" y2="1">

                                                    <stop offset="95%" stopColor="#002f5c" stopOpacity={0.9}/>
                                                </linearGradient>
                                            </defs>
                                        </Bar>
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white p-6 shadow-sm border rounded-lg">

                                <ResponsiveContainer width="100%" height="100%">
                                    <PieChart>
                                        <Pie data={stats.perfilesData} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius={40} outerRadius={70} paddingAngle={3}>
                                            <Cell fill="#10b981" /><Cell fill="#3b82f6" /><Cell fill="#8b5cf6" />
                                        </Pie>
                                        <Tooltip />
                                        <Legend verticalAlign="bottom" height={36} iconType="circle" />
                                    </PieChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                        <div className="bg-white p-6 shadow-sm border rounded-lg">
                            <h3 className="text-xs font-black uppercase mb-4 text-up-blue flex items-center gap-2"><Icon name="trophy" size={14} className="text-up-gold"/> Top 10 Ranking Acumulado ({numQuizzes} Quizzes)</h3>
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="px-4 py-2 text-left font-black text-[10px] uppercase text-gray-500">Pos</th>
                                            <th className="px-4 py-2 text-left font-black text-[10px] uppercase text-gray-500">Alumno</th>
                                            <th className="px-4 py-2 text-right font-black text-[10px] uppercase text-gray-500">Score Total</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {stats.quizRanking.map((student, idx) => (
                                            <tr key={idx} className="border-b">

                                                <td className="px-4 py-2 font-bold text-up-blue">{student.name}</td>
                                                <td className="px-4 py-2 text-right font-black text-up-red">{student.score.toLocaleString()}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderLista = () => (
                <div className="space-y-4 animate-fade pb-10">
                    <div className="bg-white p-3 shadow-sm rounded-lg border flex items-center gap-3 sticky top-16 z-40">
                        <Icon name="search" size={18} className="text-gray-400" />
                        <input type="text" placeholder="Buscar por nombre o apodo..." className="w-full outline-none text-sm" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}/>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 pb-10">
                        {filteredStudents.map((s, idx) => {
                            const rankColor = s.ranking <= 3 ? UP_GOLD : s.ranking <= 10 ? UP_BLUE : '#6b7280';
                            return (
                                <div key={idx} onClick={() => { setSelectedStudent(s); setActiveTab('individual'); }} className="bg-white p-4 border border-gray-100 shadow-sm rounded-lg flex items-center justify-between group hover:border-up-blue transition-all cursor-pointer">
                                    <div className="flex items-center gap-3 overflow-hidden flex-1 text-left">
                                        <div className="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center font-black text-sm text-white" style={{backgroundColor: rankColor}}>
                                            #{s.ranking}

                                        <div className="overflow-hidden">
                                            <p className="font-bold text-sm text-gray-800 uppercase truncate">{s.nombre}</p>
                                            <p className="text-[10px] text-up-red font-black uppercase italic">"{s.apodo}" • Score: {s.quizzes.reduce((a,b)=>a+b,0).toLocaleString()}</p>
                                            <p className="text-[9px] text-up-gold font-bold uppercase">{s.perfil?.dom || "PENDIENTE"}</p>
                                        </div>
                                    </div>
                                    <Icon name="chevron-right" size={18} className="text-gray-300 group-hover:text-up-blue shrink-0" />
                                </div>
                            );
                        })}
                    </div>
                </div>
            );

            const renderPerfil = () => {
                if (!selectedStudent) return <div className="text-center py-20 animate-fade text-gray-400 uppercase text-[10px] font-black tracking-widest">Selecciona un alumno en la pestaña Alumnos</div>;
                
                const totalScore = selectedStudent.quizzes.reduce((a,b)=>a+b,0);
                const maxS = Math.max(selectedStudent.v || 0, selectedStudent.k || 0, selectedStudent.a || 0);
                const canalD = selectedStudent.v === maxS ? 'Visual' : (selectedStudent.k === maxS ? 'Kinestésico' : 'Auditivo');
                const canalColor = canalD === 'Visual' ? 'bg-up-blue' : (canalD === 'Kinestésico' ? 'bg-up-red' : 'bg-up-gold');
                const rankColor = selectedStudent.ranking <= 3 ? UP_GOLD : selectedStudent.ranking <= 10 ? UP_BLUE : '#6b7280';
                const profileDominant = getEcoProfile(selectedStudent.perfil);

                // Armar datos del radar multidimensional
                const radarData = selectedStudent.eval_diag ? [
                    { subject: 'Liderazgo', Alumno: selectedStudent.eval_diag.liderazgo, Grupo: classSoftSkillsAverages.liderazgo },
                    { subject: 'T. Equipo', Alumno: selectedStudent.eval_diag.trabajoEquipo, Grupo: classSoftSkillsAverages.trabajoEquipo },
                    { subject: 'A. Tiempo', Alumno: selectedStudent.eval_diag.admonTiempo, Grupo: classSoftSkillsAverages.admonTiempo },
                    { subject: 'G. Cambio', Alumno: selectedStudent.eval_diag.gestionCambio, Grupo: classSoftSkillsAverages.gestionCambio },
                    { subject: 'C. Asertiva', Alumno: selectedStudent.eval_diag.comAsertiva, Grupo: classSoftSkillsAverages.comAsertiva },
                    { subject: 'Negociación', Alumno: selectedStudent.eval_diag.negociacion, Grupo: classSoftSkillsAverages.negociacion },
                    { subject: 'M. Conflictos', Alumno: selectedStudent.eval_diag.manejoConflictos, Grupo: classSoftSkillsAverages.manejoConflictos },
                    { subject: 'M. Estrés', Alumno: selectedStudent.eval_diag.manejoEstres, Grupo: classSoftSkillsAverages.manejoEstres },
                    { subject: 'Adversidad', Alumno: selectedStudent.eval_diag.manejoAdversidad, Grupo: classSoftSkillsAverages.manejoAdversidad },
                    { subject: 'Frustración', Alumno: selectedStudent.eval_diag.manejoFrustracion, Grupo: classSoftSkillsAverages.manejoFrustracion },
                    { subject: 'Ansiedad', Alumno: selectedStudent.eval_diag.manejoAnsiedad, Grupo: classSoftSkillsAverages.manejoAnsiedad }
                ] : [];

                return (
                    <div className="space-y-6 pb-20 animate-fade">
                        
                        {/* 📄 ==================== PÁGINA 1 DE IMPRESIÓN ==================== */}
                        <div className="print-page space-y-6">
                            {/* Cabecera de Impresión Oficial (Solo visible en PDF impreso) */}
                            <div className="print-header-dossier text-center">
                                <h1 className="text-xl font-black text-up-blue uppercase tracking-tight">Universidad Panamericana</h1>
                                <p className="text-[10px] font-bold text-gray-500 uppercase tracking-[4px] mb-2">Facultad de Empresariales • Escuela de Dirección</p>
                                <h2 className="text-sm font-bold text-up-red uppercase tracking-widest mt-1">Dossier de Desarrollo Directivo y Plan de Acción</h2>
                                <p className="text-[8px] font-semibold text-gray-400 mt-1">Asignatura: Competencias Directivas • Ciclo Escolar 2026</p>
                            </div>

                            {/* Cabecera de Identidad */}
                            <div className="bg-white p-6 border shadow-sm border-t-8 border-up-blue rounded-b-lg text-center">
                                <div className="flex justify-center items-center gap-4 mb-4">
                                    <div className="w-24 h-24 up-blue text-white flex items-center justify-center text-4xl font-black shadow-xl rounded-md">{selectedStudent.nombre[0]}</div>
                                    <div className="flex flex-col items-center justify-center w-20 h-20 rounded-full shadow-xl text-white" style={{backgroundColor: rankColor}}>
                                        <div className="text-[10px] font-black uppercase">Lugar</div>
                                        <div className="text-3xl font-black">#{selectedStudent.ranking}</div>
                                    </div>
                                </div>
                                <h2 className="text-3xl font-black text-gray-800 uppercase tracking-tighter leading-tight">{selectedStudent.nombre}</h2>
                                <p className="text-up-red font-bold text-2xl mt-1 italic">"{selectedStudent.apodo}"</p>
                                <div className="flex flex-wrap justify-center gap-4 mt-6 border-t pt-6 w-full text-[10px] font-black uppercase text-gray-400">
                                    <span className={`text-white px-2 py-0.5 rounded ${canalColor}`}>{canalD}</span>
                                    {selectedStudent.perfil?.dom && <span className="text-white px-2 py-0.5 bg-green-600 rounded">{selectedStudent.perfil.dom}</span>}
                                    <span>{selectedStudent.carrera}</span>
                                    <span className="text-up-red font-bold tracking-tight">Acumulado Menti: {totalScore.toLocaleString()}</span>
                                </div>
                            </div>

                            {/* Bloque de Calificaciones del Periodo */}

                                <h3 className="text-xs font-black uppercase mb-4 flex items-center gap-2 justify-center">
                                    <Icon name="award" size={16} className="text-white"/> Calificaciones del Periodo
                                </h3>
                                <div className="grid grid-cols-3 gap-3 md:gap-4">
                                    <div className="bg-white/10 p-3 sm:p-4 rounded-lg backdrop-blur">
                                        <p className="text-[8px] sm:text-[10px] font-black uppercase mb-1 sm:mb-2 opacity-90 tracking-wider">1er Parcial</p>
                                        <p className="text-lg sm:text-2xl md:text-3xl font-black text-white">{selectedStudent.parcial1?.toFixed(2) || '—'}</p>
                                    </div>
                                    <div className="bg-white/10 p-3 sm:p-4 rounded-lg backdrop-blur">

                                        <p className="text-lg sm:text-2xl md:text-3xl font-black text-white">{selectedStudent.parcial2?.toFixed(2) || '—'}</p>

                                    <div className="bg-white/20 p-3 sm:p-4 rounded-lg backdrop-blur border border-white/30">
                                        <p className="text-[8px] sm:text-[10px] font-black uppercase mb-1 sm:mb-2 tracking-wider">Promedio Final</p>
                                        <p className="text-lg sm:text-2xl md:text-3xl font-black text-white">{selectedStudent.promedio?.toFixed(3) || '—'}</p>
                                    </div>
                                </div>
                            </div>

                            {/* Psicometría VAK Radar */}

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">

                                        <ResponsiveContainer width="100%" height="100%">
                                            <RadarChart cx="50%" cy="50%" outerRadius="70%" data={[
                                                { subject: 'Visual', A: selectedStudent.v || 0 },
                                                { subject: 'Kinestésico', A: selectedStudent.k || 0 },
                                                { subject: 'Auditivo', A: selectedStudent.a || 0 },
                                            ]}>
                                                <PolarGrid stroke="#eee" />
                                                <PolarAngleAxis dataKey="subject" tick={{fontSize: 9, fontWeight: 'black', fill: '#004b8d'}} />
                                                <Radar dataKey="A" stroke={UP_BLUE} fill={UP_BLUE} fillOpacity={0.4} />

                                        </ResponsiveContainer>
                                    </div>
                                    <div className="text-xs space-y-2 text-gray-600 leading-relaxed">

                                        <p>Esta preferencia perceptiva determina la vía óptima para la asimilación de conceptos complejos y la respuesta del alumno bajo condiciones de alta demanda docente.</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 📄 ==================== PÁGINA 2 DE IMPRESIÓN ==================== */}
                        <div className="print-page space-y-6">
                            {/* Cabecera de Control para Página Secundaria */}

                                <div className="flex justify-between items-center text-[8px] font-black text-up-blue uppercase">
                                    <span>Universidad Panamericana • Facultad de Empresariales</span>
                                    <span>Expediente: {selectedStudent.nombre}</span>
                                </div>
                            </div>

                            {/* Evaluación de Soft Skills */}
                            <div className="bg-white p-6 shadow-sm border rounded-lg text-left">
                                <h3 className="text-xs font-black uppercase mb-4 text-up-blue flex items-center gap-2 border-b pb-3">
                                    <Icon name="target" size={16} className="text-up-blue"/> Evaluación Diagnóstica Multidimensional (Soft Skills)
                                </h3>
                                
                                {selectedStudent.eval_diag ? (
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-center">
                                        {/* Gráfico de Radar de Soft Skills */}
                                        <div className="h-[280px] print-chart-tall">
                                            <p className="text-[8px] font-black text-gray-400 uppercase tracking-widest mb-1 text-center">Firma de Habilidades Directivas vs. Clase</p>

                                                    <Legend wrapperStyle={{ fontSize: '9px', fontWeight: 'bold' }} />
                                                </RadarChart>
                                            </ResponsiveContainer>
                                        </div>

                                        {/* Desglose de los 3 Bloques Pedagógicos */}
                                        <div className="space-y-3">
                                            <div>
                                                <h4 className="text-[8px] font-black uppercase text-up-blue tracking-wider mb-1">1. Socio-Ejecutivas</h4>
                                                <div className="grid grid-cols-2 gap-1.5 text-[9px] font-bold">
                                                    <div className={`p-1.5 border rounded flex justify-between ${getSkillColorClass(selectedStudent.eval_diag.liderazgo)}`}><span>Liderazgo</span> <span>{selectedStudent.eval_diag.liderazgo}</span></div>
                                                    <div className={`p-1.5 border rounded flex justify-between ${getSkillColorClass(selectedStudent.eval_diag.trabajoEquipo)}`}><span>T. Equipo</span> <span>{selectedStudent.eval_diag.trabajoEquipo}</span></div>
                                                    <div className={`p-1.5 border rounded flex justify-between ${getSkillColorClass(selectedStudent.eval_diag.admonTiempo)}`}><span>A. Tiempo</span> <span>{selectedStudent.eval_diag.admonTiempo}</span></div>
                                                    <div className={`p-1.5 border rounded flex justify-between ${getSkillColorClass(selectedStudent.eval_diag.gestionCambio)}`}><span>G. Cambio</span> <span>{selectedStudent.eval_diag.gestionCambio}</span></div>
                                                </div>
                                            </div>
                                            <div>
                                                <h4 className="text-[8px] font-black uppercase text-up-gold tracking-wider mb-1">2. Interpersonales</h4>
                                                <div className="grid grid-cols-3 gap-1.5 text-[9px] font-bold">
                                                    <div className={`p-1.5 border rounded flex flex-col items-center ${getSkillColorClass(selectedStudent.eval_diag.comAsertiva)}`}><span className="text-[8px] opacity-85 text-center truncate w-full">Asertiva</span> <span>{selectedStudent.eval_diag.comAsertiva}</span></div>
                                                    <div className={`p-1.5 border rounded flex flex-col items-center ${getSkillColorClass(selectedStudent.eval_diag.negociacion)}`}><span className="text-[8px] opacity-85 text-center truncate w-full">Negociación</span> <span>{selectedStudent.eval_diag.negociacion}</span></div>
                                                    <div className={`p-1.5 border rounded flex flex-col items-center ${getSkillColorClass(selectedStudent.eval_diag.manejoConflictos)}`}><span className="text-[8px] opacity-85 text-center truncate w-full">Conflictos</span> <span>{selectedStudent.eval_diag.manejoConflictos}</span></div>
                                                </div>
                                            </div>
                                            <div>
                                                <h4 className="text-[8px] font-black uppercase text-up-red tracking-wider mb-1">3. Regulación Emocional</h4>
                                                <div className="grid grid-cols-2 gap-1.5 text-[9px] font-bold">
                                                    <div className={`p-1.5 border rounded flex justify-between ${getSkillColorClass(selectedStudent.eval_diag.manejoEstres)}`}><span>M. Estrés</span> <span>{selectedStudent.eval_diag.manejoEstres}</span></div>
                                                    <div className={`p-1.5 border rounded flex justify-between ${getSkillColorClass(selectedStudent.eval_diag.manejoAdversidad)}`}><span>Adversidad</span> <span>{selectedStudent.eval_diag.manejoAdversidad}</span></div>
                                                    <div className={`p-1.5 border rounded flex justify-between ${getSkillColorClass(selectedStudent.eval_diag.manejoFrustracion)}`}><span>Frustración</span> <span>{selectedStudent.eval_diag.manejoFrustracion}</span></div>
                                                    <div className={`p-1.5 border rounded flex justify-between ${getSkillColorClass(selectedStudent.eval_diag.manejoAnsiedad)}`}><span>Ansiedad</span> <span>{selectedStudent.eval_diag.manejoAnsiedad}</span></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-yellow-50 border border-yellow-200 text-yellow-800 p-4 rounded text-xs leading-relaxed">
                                        <p className="font-bold uppercase tracking-widest text-[9px] mb-2 flex items-center gap-1.5"><Icon name="alert-circle" size={12} /> Diagnóstico Inicial Pendiente</p>
                                        <p className="mb-3">Este estudiante no registra datos en el test de autodiagnóstico de Soft Skills de la UP. A continuación se presenta la hipótesis docente preliminar para su plan de desarrollo directivo:</p>
                                        <div className="bg-white p-3 rounded border border-yellow-100 space-y-2 text-gray-700">
                                            <p><strong>Firma VAK Detectada:</strong> {canalD} ({selectedStudent.v || 0} Vis, {selectedStudent.k || 0} Kin, {selectedStudent.a || 0} Aud)</p>
                                            <p><strong>Hipótesis Metodológica:</strong> El alumno se desempeña con solidez técnica en actividades operativas, pero requiere ser retado a liderar y coordinar dinámicas complejas para evaluar su tolerancia al estrés y regulación ante la frustración.</p>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Perfil Económico ECO */}
                            <div className="bg-white p-6 border shadow-sm rounded-lg border-l-8 border-up-red text-left print-compact">
                                <h3 className="text-[11px] font-black uppercase text-up-red mb-3 flex items-center gap-2 border-b pb-2"><Icon name="target" size={16} /> Orientación Profesional ECO</h3>
                                {selectedStudent.perfil?.dom ? (
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
                                        <div className="col-span-1 bg-gray-50 p-3 rounded text-center">
                                            <p className="text-[8px] font-black text-gray-400 uppercase tracking-widest mb-1 leading-none">Dominancia</p>
                                            <span className="text-up-red font-black text-xs uppercase tracking-tighter">{selectedStudent.perfil.dom}</span>
                                        </div>
                                        <div className="col-span-3 grid grid-cols-3 gap-3 text-center">
                                            <div><p className="text-[8px] font-black text-gray-400 uppercase">Emprendedor</p><p className="text-base font-black">{selectedStudent.perfil.emp || 0}</p></div>
                                            <div><p className="text-[8px] font-black text-gray-400 uppercase">Consultor</p><p className="text-base font-black">{selectedStudent.perfil.cons || 0}</p></div>
                                            <div><p className="text-[8px] font-black text-gray-400 uppercase">Corporativo</p><p className="text-base font-black">{selectedStudent.perfil.corp || 0}</p></div>
                                        </div>
                                    </div>
                                ) : (
                                    <p className="text-xs text-gray-400 italic text-center">Datos del test ECO no registrados.</p>
                                )}
                            </div>

                            {/* Perfil Profesional (CV) */}
                            <div className="bg-white p-6 border shadow-sm rounded-lg border-l-8 border-up-blue text-left print-compact">
                                <h3 className="text-[11px] font-black uppercase text-up-blue mb-3 flex items-center gap-2 border-b pb-2"><Icon name="briefcase" size={16} /> Perfil Profesional (CV)</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div><p className="text-[8px] font-black text-gray-400 uppercase tracking-widest mb-1">Experiencia</p><p className="text-xs font-bold text-gray-700 leading-relaxed">{selectedStudent.cv.exp}</p></div>
                                    <div><p className="text-[8px] font-black text-gray-400 uppercase tracking-widest mb-1">Hard Skills</p><p className="text-xs font-bold text-gray-700 leading-relaxed">{selectedStudent.cv.skills}</p></div>
                                    <div><p className="text-[8px] font-black text-gray-400 uppercase tracking-widest mb-1">Rol Sugerido</p><span className="bg-blue-50 text-up-blue px-2 py-1 rounded-sm text-[9px] font-black uppercase inline-block">{selectedStudent.cv.rol}</span></div>
                                </div>
                            </div>
                        </div>

                        {/* 📄 ==================== PÁGINA 3 DE IMPRESIÓN ==================== */}
                        <div className="print-page space-y-6">
                            {/* Cabecera de Control para Página Terciaria */}
                            <div className="print-header-dossier text-center pb-2 mb-2 border-b border-gray-200">
                                <div className="flex justify-between items-center text-[8px] font-black text-up-blue uppercase">
                                    <span>Universidad Panamericana • Facultad de Empresariales</span>
                                    <span>Expediente: {selectedStudent.nombre}</span>
                                </div>
                            </div>

                            {/* Bloques de Historial Mentimeter y Asistencia en un grid limpio */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {/* Desempeño Mentimeter */}
                                <div className="bg-white p-4 border shadow-sm rounded-lg border-l-4 border-up-gold text-left print-compact">
                                    <h3 className="text-[10px] font-black uppercase text-up-gold mb-2 flex items-center gap-1.5"><Icon name="bar-chart-2" size={14}/> Historial Mentimeter ({numQuizzes} Quizzes)</h3>
                                    <div className="grid grid-cols-5 gap-1 text-center">
                                        {selectedStudent.quizzes.map((score, i) => (
                                            <div key={i} className="bg-gray-50 p-1 rounded border-b-2 border-up-blue text-[9px]">
                                                <p className="text-[7px] text-gray-400 uppercase font-bold">Q{i+1}</p>
                                                <p className="font-black text-gray-800">{score > 0 ? score.toLocaleString() : '—'}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Asistencia Acumulada */}
                                <div className="bg-white p-4 border shadow-sm rounded-lg border-l-4 border-up-blue text-left print-compact">
                                    <h3 className="text-[10px] font-black uppercase text-up-blue mb-2 flex items-center gap-1.5"><Icon name="check-square" size={14}/> Asistencia Semanal ({numAsistencias} Clases)</h3>
                                    <div className="flex flex-wrap gap-1 text-center">
                                        {selectedStudent.asistencia.map((status, i) => (
                                            <div key={i} className="flex-1 min-w-[20px] text-[8px]">
                                                <p className="text-[6px] text-gray-400 font-bold mb-0.5">S{i+1}</p>
                                                <div className={`w-5 h-5 rounded-sm flex items-center justify-center font-black ${status==='A'?'bg-green-100 text-green-700':status==='F'?'bg-red-100 text-red-700':'bg-yellow-100 text-yellow-700'}`}>{status}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Identidad Académica & Valores */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-left">
                                <div className="bg-white p-5 border shadow-sm rounded-lg border-up-gold border-l-8 print-compact">
                                    <h3 className="text-[10px] font-black uppercase text-up-gold mb-2 border-b pb-1.5 flex items-center gap-1.5"><Icon name="star" size={14} /> Identidad Académica</h3>
                                    <div className="space-y-1.5 text-[11px]">
                                        <p><span className="font-black text-up-blue uppercase block text-[9px] mb-0.5">Pasatiempo:</span> {selectedStudent.hobbie}</p>
                                        <p><span className="font-black text-up-red uppercase block text-[9px] mb-0.5">Es un crack para:</span> {selectedStudent.crack}</p>
                                    </div>
                                </div>
                                <div className="bg-white p-5 border shadow-sm rounded-lg print-compact">
                                    <h3 className="text-[10px] font-black uppercase mb-2 border-b pb-1.5 tracking-[1px]">Tríada de Valores</h3>
                                    <div className="grid grid-cols-1 gap-1 text-[9px] font-bold text-gray-700 uppercase">
                                        {selectedStudent.valores.map((v, i) => <div key={i} className="bg-gray-50 p-1.5 border-l-4 border-up-gold rounded truncate">{i+1}. {v}</div>)}
                                    </div>
                                </div>
                            </div>

                            {/* Competencias Cruzadas & Psicometría */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-left print-compact-grid">
                                <div className="bg-white p-5 border shadow-sm border-l-4 border-green-600 rounded-lg print-compact">
                                    <h3 className="text-[10px] font-black uppercase text-green-700 mb-3 tracking-[1px] flex items-center gap-1.5"><Icon name="user-check" size={14} /> Percepción Propia</h3>
                                    <div className="space-y-1.5">{selectedStudent.altasPropia.slice(0,3).map((c, i) => <div key={i} className="bg-green-50 p-2 border-l-4 border-green-600 font-black text-[10px] uppercase text-gray-800">{c}</div>)}</div>
                                </div>
                                <div className="bg-white p-5 border shadow-sm border-l-4 border-up-gold rounded-lg print-compact">
                                    <h3 className="text-[10px] font-black uppercase text-up-gold mb-3 tracking-[1px] flex items-center gap-1.5"><Icon name="award" size={14} /> Wingfinder (Psicometría)</h3>
                                    <div className="grid grid-cols-1 gap-1">{selectedStudent.wingfinder.slice(0,4).map((c, i) => <div key={i} className="bg-yellow-50 p-2 border border-yellow-100 font-black text-[9px] uppercase text-gray-800 rounded-sm text-center">{c}</div>)}</div>
                                </div>
                            </div>

                            {/* Áreas de Oportunidad */}
                            <div className="bg-white p-5 border shadow-sm border-l-4 border-up-red rounded-lg text-left print-compact">
                                <h3 className="text-[10px] font-black uppercase text-up-red mb-3 tracking-[2px] flex items-center gap-1.5"><Icon name="target" size={14} /> Áreas de Oportunidad (3)</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                    {selectedStudent.bajas.slice(0,3).map((c, i) => <div key={i} className="bg-red-50 p-2 border-l-4 border-up-red font-black text-[10px] uppercase text-gray-800 truncate text-center flex items-center justify-center leading-tight min-h-[30px]">{c}</div>)}
                                </div>
                            </div>

                            {/* Plan de Acción */}
                            <div className="bg-gray-900 text-white p-6 border-t-8 border-up-red shadow-2xl rounded-lg text-left print-compact print-gray-bg print-black-text">
                                <h3 className="text-base font-black uppercase tracking-tighter mb-2 text-up-gold flex items-center gap-2"><Icon name="zap" size={18} className="text-up-gold" /> Plan de Acción y Estrategia Docente Táctica</h3>
                                <p className="text-xs font-light leading-relaxed">
                                    El diagnóstico cruzado sugiere potenciar su competencia de <strong className="text-up-blue uppercase">{selectedStudent.altasPropia[0]}</strong> vinculándola con la fortaleza técnica detectada en el test: <strong className="text-up-blue uppercase">{selectedStudent.wingfinder[0]}</strong>. Al ser un perfil con un estilo de percepción dominantemente <strong>{canalD}</strong>, se recomienda dar feedback {canalD === 'Visual' ? 'mediante diagramas estructurados' : 'a través de aplicaciones prácticas'}, apelando a su valor de <strong>{selectedStudent.valores[0]}</strong>.
                                    {selectedStudent.perfil?.dom && <span> Su orientación directiva <strong className="text-up-blue uppercase">{selectedStudent.perfil.dom}</strong> sugiere asignarle {selectedStudent.perfil.dom === 'EMPRENDEDOR' ? 'proyectos de innovación y creación' : selectedStudent.perfil.dom === 'CONSULTOR' ? 'tareas de asesoría y análisis estratégico' : 'responsabilidades estructuradas en entornos corporativos'}.</span>}
                                </p>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col pb-10">
                    <header className="bg-white border-b-2 border-up-blue sticky top-0 z-50 p-4 shadow-md flex justify-between items-center text-left">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 up-blue text-white flex items-center justify-center font-black text-lg shadow rounded-sm shrink-0">UP</div>
                            <div className="hidden sm:block text-[10px] font-black text-up-blue uppercase tracking-tight leading-none">Competencias Directivas<br/><span className="text-up-red text-[8px]">v25.0 FINAL • CIERRE DE SEMESTRE (20-MAY)</span></div>
                        </div>
                        <div className="flex bg-gray-100 p-1 rounded-lg">
                            <button onClick={() => setActiveTab('resumen')} className={`px-4 py-2 rounded-md transition-all flex items-center gap-2 ${activeTab === 'resumen' ? 'bg-white text-up-blue shadow-md' : 'text-gray-400'}`} title="Dashboard"><Icon name="bar-chart-3" /></button>
                            <button onClick={() => setActiveTab('busqueda')} className={`px-4 py-2 rounded-md transition-all flex items-center gap-2 ${activeTab === 'busqueda' ? 'bg-white text-up-blue shadow-md' : 'text-gray-400'}`} title="Lista de Alumnos"><Icon name="users" /></button>
                            <button onClick={() => setActiveTab('individual')} className={`px-4 py-2 rounded-md transition-all flex items-center gap-2 ${activeTab === 'individual' ? 'bg-white text-up-blue shadow-md' : 'text-gray-400'}`} title="Ficha Individual"><Icon name="user" /></button>
                        </div>
                    </header>
                    <main className="max-w-5xl mx-auto w-full p-4 md:p-8 flex-grow">
                        {activeTab === 'resumen' && renderResumen()}{activeTab === 'busqueda' && renderLista()}{activeTab === 'individual' && renderPerfil()}
                    </main>
                    {selectedStudent && activeTab === 'individual' && (
                        <button 
                            onClick={() => window.print()}
                            className="fixed bottom-6 right-6 w-12 h-12 bg-[#ce1126] text-white rounded-full shadow-2xl flex items-center justify-center animate-bounce no-print hover:scale-110 active:scale-95 transition-all"
                            title="Descargar Dossier en PDF"
                        >
                           <Icon name="download" size={20} className="text-white" />
                        </button>
                    )}
                    <footer className="text-center py-6 text-[9px] font-black uppercase text-gray-300 tracking-[4px]">Ubi spiritus, libertas • Facultad de Empresariales • © 2026</footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
